services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "8765:8765"
    user: "${GIJIROKU_UID:-65532}:${GIJIROKU_GID:-65532}"
    environment:
      GIJIROKU_BIND: 0.0.0.0
      GIJIROKU_PORT: "8765"
      GIJIROKU_DATA_DIR: /data
      GIJIROKU_KNOWLEDGE_ROOT: /knowledge
      GIJIROKU_NO_BROWSER: "1"
      GIJIROKU_TRUST_PROXY: ${GIJIROKU_TRUST_PROXY:-0}
      GIJIROKU_SECURE_COOKIE: ${GIJIROKU_SECURE_COOKIE:-0}
      # Free プランの上限（仮の値）。unlimited で無制限
      GIJIROKU_FREE_MONTHLY_MEETINGS: ${GIJIROKU_FREE_MONTHLY_MEETINGS:-10}
      GIJIROKU_FREE_MEETING_MINUTES: ${GIJIROKU_FREE_MEETING_MINUTES:-600}
      GIJIROKU_FREE_STORAGE_MB: ${GIJIROKU_FREE_STORAGE_MB:-1024}
      GIJIROKU_FREE_CONCURRENT_RECORDINGS: ${GIJIROKU_FREE_CONCURRENT_RECORDINGS:-1}
      GIJIROKU_FREE_REALTIME_CAPTIONS: ${GIJIROKU_FREE_REALTIME_CAPTIONS:-1}
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - ${GIJIROKU_HOST_DATA:-gijiroku-data}:/data
      - ./knowledge:/knowledge:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  app-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      GIJIROKU_BIND: 0.0.0.0
      GIJIROKU_PORT: "8765"
      GIJIROKU_DATA_DIR: /data
      GIJIROKU_KNOWLEDGE_ROOT: /knowledge
      GIJIROKU_WEB_DIR: /app/web/dist
      GIJIROKU_NO_BROWSER: "1"
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - .:/app
      - gijiroku-data:/data
      - ./knowledge:/knowledge:ro
      - cargo-registry:/usr/local/cargo/registry
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /app

volumes:
  gijiroku-data:
  cargo-registry:
