services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "8765:8765"
    user: "${KIKIMIMI_UID:-65532}:${KIKIMIMI_GID:-65532}"
    environment:
      KIKIMIMI_BIND: 0.0.0.0
      KIKIMIMI_PORT: "8765"
      KIKIMIMI_DATA_DIR: /data
      KIKIMIMI_KNOWLEDGE_ROOT: /knowledge
      KIKIMIMI_NO_BROWSER: "1"
      KIKIMIMI_TRUST_PROXY: ${KIKIMIMI_TRUST_PROXY:-0}
      KIKIMIMI_SECURE_COOKIE: ${KIKIMIMI_SECURE_COOKIE:-0}
      # Free プランの上限（仮の値）。unlimited で無制限
      KIKIMIMI_FREE_DAILY_MEETINGS: ${KIKIMIMI_FREE_DAILY_MEETINGS:-30}
      KIKIMIMI_FREE_MEETING_MINUTES: ${KIKIMIMI_FREE_MEETING_MINUTES:-600}
      KIKIMIMI_FREE_STORAGE_MB: ${KIKIMIMI_FREE_STORAGE_MB:-1024}
      KIKIMIMI_FREE_CONCURRENT_RECORDINGS: ${KIKIMIMI_FREE_CONCURRENT_RECORDINGS:-1}
      KIKIMIMI_FREE_REALTIME_CAPTIONS: ${KIKIMIMI_FREE_REALTIME_CAPTIONS:-1}
      KIKIMIMI_SMTP_HOST: ${KIKIMIMI_SMTP_HOST:-}
      KIKIMIMI_SMTP_PORT: ${KIKIMIMI_SMTP_PORT:-587}
      KIKIMIMI_SMTP_TLS: ${KIKIMIMI_SMTP_TLS:-}
      KIKIMIMI_SMTP_USER: ${KIKIMIMI_SMTP_USER:-}
      KIKIMIMI_SMTP_PASSWORD: ${KIKIMIMI_SMTP_PASSWORD:-}
      KIKIMIMI_SMTP_FROM: ${KIKIMIMI_SMTP_FROM:-}
      KIKIMIMI_MAIL_DIR: ${KIKIMIMI_MAIL_DIR:-}
      KIKIMIMI_INVITE_CODE: ${KIKIMIMI_INVITE_CODE:-}
      KIKIMIMI_FESS_HOSTS: ${KIKIMIMI_FESS_HOSTS:-}
      KIKIMIMI_ALLOW_CLOUD_SPEECH: ${KIKIMIMI_ALLOW_CLOUD_SPEECH:-}
      KIKIMIMI_WORKERS: ${KIKIMIMI_WORKERS:-}
      KIKIMIMI_USAGE_UTC_OFFSET: ${KIKIMIMI_USAGE_UTC_OFFSET:-+09:00}
      RUST_LOG: ${RUST_LOG:-kikimimi=info}
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - ${KIKIMIMI_HOST_DATA:-kikimimi-data}:/data
      - ./knowledge:/knowledge:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  app-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      KIKIMIMI_BIND: 0.0.0.0
      KIKIMIMI_PORT: "8765"
      KIKIMIMI_DATA_DIR: /data
      KIKIMIMI_KNOWLEDGE_ROOT: /knowledge
      KIKIMIMI_WEB_DIR: /app/web/dist
      KIKIMIMI_NO_BROWSER: "1"
      KIKIMIMI_SMTP_HOST: ${KIKIMIMI_SMTP_HOST:-}
      KIKIMIMI_SMTP_PORT: ${KIKIMIMI_SMTP_PORT:-587}
      KIKIMIMI_SMTP_TLS: ${KIKIMIMI_SMTP_TLS:-}
      KIKIMIMI_SMTP_USER: ${KIKIMIMI_SMTP_USER:-}
      KIKIMIMI_SMTP_PASSWORD: ${KIKIMIMI_SMTP_PASSWORD:-}
      KIKIMIMI_SMTP_FROM: ${KIKIMIMI_SMTP_FROM:-}
      KIKIMIMI_MAIL_DIR: ${KIKIMIMI_MAIL_DIR:-}
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - .:/app
      - kikimimi-data:/data
      - ./knowledge:/knowledge:ro
      - cargo-registry:/usr/local/cargo/registry
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /app

volumes:
  # 既存の環境ではこの名前のボリュームをそのまま使い、新しい環境では作る。
  kikimimi-data:
    name: kikimimi_kikimimi-data
  cargo-registry:
